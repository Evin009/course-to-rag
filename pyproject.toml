[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicc-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # [default] adds the solver for YouTube's JavaScript challenges (needs deno).
    "yt-dlp[default]>=2025.10.22",
    "webvtt-py>=0.4.6",
    "numpy>=1.26",
    "imagehash>=4.3",
    "pillow>=10.0",
    "faster-whisper>=1.0",
    # faster-whisper 1.2.1 passes metadata_errors= to av.open, which fails
    # with PyAV 19 ("unexpected keyword argument").
    "av>=11,<19",
    "pytesseract>=0.3.10",
    "reportlab>=4.0",
    "pypdf>=4.0",
]

[project.scripts]
aicc-extract = "aicc_demo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
cloud = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30",
    "google-cloud-firestore>=2.19", "google-cloud-storage>=2.18", "google-cloud-run>=0.10",
]
# Retrieval + answer demo (demo.py): embeddings pull in PyTorch, so it is
# kept out of the default install and the cloud image.
demo = ["sentence-transformers>=3.0", "google-genai>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
