[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicc-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "yt-dlp>=2024.8.6",
    "webvtt-py>=0.4.6",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "imagehash>=4.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
